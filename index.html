<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#3f6650" />
  <meta name="description" content="金刚经每日读诵、打卡、共修与徽章" />
  <title>金刚经 · 每日读诵共修</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="headerEyebrow">每日读诵 · 共修</div>
        <h1 id="headerTitle">金刚经</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="langBtn" title="繁简切换">繁</button>
        <button class="icon-btn" id="shareBtn" title="分享">↗</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-tab="today" class="nav-item active"><span>☀</span><b data-i18n="navToday">今日</b></button>
      <button data-tab="read" class="nav-item"><span>📖</span><b data-i18n="navRead">读诵</b></button>
      <button data-tab="checkin" class="nav-item"><span>✓</span><b data-i18n="navCheckin">打卡</b></button>
      <button data-tab="group" class="nav-item"><span>◉</span><b data-i18n="navGroup">共修</b></button>
      <button data-tab="profile" class="nav-item"><span>☰</span><b data-i18n="navMe">我的</b></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="sutra-data.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
